services:
  db:
    image: postgres:15-alpine
    container_name: hunterops-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hunter}
      POSTGRES_DB: ${POSTGRES_DB:-hunterops}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hunter} -d ${POSTGRES_DB:-hunterops}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: ${DB_MEM_LIMIT:-1g}
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-1.0}"
          memory: ${DB_MEM_LIMIT:-1g}
    networks:
      - hunterops-internal

  redis:
    image: redis:7-alpine
    container_name: hunterops-redis
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    volumes:
      - redis-data:/data
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-0.5}"
          memory: ${REDIS_MEM_LIMIT:-256m}
    networks:
      - hunterops-internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hunterops-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Aqui é onde a mágica acontece: o env_file carrega tudo
    env_file:
      - .env
    environment:
      # Mantemos apenas o que é fixo da infraestrutura Docker
      HUNTEROPS_HOME: /opt/hunterops
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # As URLs de Webhook e chaves de API agora virão 100% do seu .env automaticamente
    volumes:
      - ./config:/opt/hunterops/config:ro
      - ./templates:/opt/hunterops/templates:ro
      - ./wordlists:/opt/hunterops/wordlists:ro
      - hunterops-data:/opt/hunterops/data
      - ./data/targets:/opt/hunterops/data/targets:rw
      - hunterops-reports:/opt/hunterops/reports
    command:
      [
        "python",
        "scripts/run_scheduler.py",
        "--config",
        "config/engine.yaml",
        "--targets-file",
        "${TARGETS_FILE:-data/targets/in_scope_hosts.txt}",
        "--out-dir",
        "/opt/hunterops/reports/research"
      ]
    healthcheck:
      test: ["CMD-SHELL", "python scripts/monitor_status.py --health-check --quiet"]
      interval: 60s
      timeout: 12s
      retries: 3
    mem_limit: ${APP_MEM_LIMIT:-2g}
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-1.5}"
          memory: ${APP_MEM_LIMIT:-2g}
    networks:
      - hunterops-internal
      - hunterops-egress

  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hunterops-monitor
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HUNTEROPS_HOME: /opt/hunterops
      POSTGRES_HOST: db
    volumes:
      - hunterops-data:/opt/hunterops/data
      - ./data/targets:/opt/hunterops/data/targets:rw
      - hunterops-reports:/opt/hunterops/reports
    command: ["python", "scripts/monitor_status.py", "--interval-hours", "${MONITOR_INTERVAL_HOURS:-6}"]
    mem_limit: ${MONITOR_MEM_LIMIT:-256m}
    deploy:
      resources:
        limits:
          cpus: "${MONITOR_CPUS:-0.5}"
          memory: ${MONITOR_MEM_LIMIT:-256m}
    networks:
      - hunterops-internal
      - hunterops-egress

volumes:
  pgdata:
  redis-data:
  hunterops-data:
  hunterops-reports:

networks:
  hunterops-internal:
    driver: bridge
    internal: true
  hunterops-egress:
    driver: bridge
