global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "hunterops-pipeline"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:9108"
          - "localhost:9108"
  - job_name: "node"
    static_configs:
      - targets:
          - "node-exporter:9100"
